name: Checks

# Runs on every push and pull request: type checks and the automated tests for both
# the API and the website, and a production build of the website. A red cross here
# means something is broken before it reaches the live site.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node scripts/run-tests.mjs

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/run-tests.mjs
      - run: npx next build
        env:
          NEXT_PUBLIC_ORIGIN: https://web-beta-blush-85.vercel.app
