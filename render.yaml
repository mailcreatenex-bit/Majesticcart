services:
  - type: web
    name: majestic-cart-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Deploy on every push to the connected branch, so the API cannot fall behind the site again.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY_VERSION
        value: "1"
      # ---- File storage (recharge screenshots, profile photos, product images).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL_BASE
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # ---- Messages to members. Nothing is sent until a real provider is set:
      #      SMS needs SMS_PROVIDER other than "console"; WhatsApp needs both
      #      WHATSAPP_ENDPOINT and WHATSAPP_TOKEN; email needs EMAIL_PROVIDER=resend.
      - key: SMS_PROVIDER
        value: console
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_ENDPOINT
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_OTP_TEMPLATE_ID
        sync: false
      - key: WHATSAPP_ENDPOINT
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OUTBOUND_NOTIFICATIONS
        value: "true"
      # ---- Optional extras. Most integrations (delivery company, SMS, WhatsApp, email, alert address)
      #      are entered by an admin under Integrations in the console, not here.
      - key: ALERT_EMAIL
        sync: false
      - key: PUSH_CONTACT
        sync: false
      # ---- Admin sign-in: two-factor is required on every admin account.
      #      Set to "false" only to recover from a lock-out, then set it back.
      - key: ADMIN_REQUIRE_2FA
        value: "true"
      # ---- Couriers (all optional; see backend/.env.example).
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: COURIER_WEBHOOK_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
